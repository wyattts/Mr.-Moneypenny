name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Build and release (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: appimage
          - platform: macos-latest
            target: aarch64-apple-darwin
            artifact: macos-arm64
          - platform: macos-latest
            target: x86_64-apple-darwin
            artifact: macos-x86_64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
      # SLSA build-provenance attestations (audit B-3). Each matrix
      # leg signs its own artifacts via Sigstore's keyless OIDC flow
      # and uploads the attestation to GitHub's attestation API. Users
      # can verify with `gh attestation verify <file> -R wyattts/Mr.-Moneypenny`
      # offline; defends against repo or release-page tampering.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - run: npm ci
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # linuxdeploy bundles a `strip` that pre-dates ELF .relr.dyn
          # sections; suppress its stripping so the AppImage build
          # succeeds on modern binutils.
          NO_STRIP: true
          # Tauri updater signing — when these are set, tauri-action
          # builds the per-platform updater bundle (.AppImage.tar.gz,
          # .app.tar.gz, .nsis.zip) and emits a signed `latest.json`
          # manifest into the release. The pubkey embedded in
          # tauri.conf.json verifies these on the client at update time.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS signing/notarization (set when sponsorship covers Apple Dev cost)
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows signing (set when sponsorship covers Authenticode cert)
          # WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          # WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          args: --target ${{ matrix.target }}
          tagName: ${{ github.ref_name }}
          releaseName: "Mr. Moneypenny ${{ github.ref_name }}"
          releaseBody: |
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.

            **macOS / Windows builds are unsigned in this release.** You may see a Gatekeeper or SmartScreen warning. See [docs/distribution.md](https://github.com/${{ github.repository }}/blob/main/docs/distribution.md) for verification instructions and how to bypass.

            ---

            Mr. Moneypenny is free software under the **AGPL-3.0-or-later**. Corresponding source code is available at https://github.com/${{ github.repository }} (this repository). See [LICENSE](https://github.com/${{ github.repository }}/blob/main/LICENSE).
          releaseDraft: true
          prerelease: false

      - name: Sign AppImage with GPG
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -z "$GPG_SIGNING_KEY" ]; then
            echo "GPG_SIGNING_KEY not set; skipping AppImage signing."
            exit 0
          fi
          # Configure gpg-agent to allow loopback pinentry. Without
          # this the agent falls back to a curses pinentry that the
          # headless runner can't open ("Inappropriate ioctl for
          # device"). With it, signing works regardless of whether
          # the key has a passphrase.
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          gpg-connect-agent reloadagent /bye || true
          echo "$GPG_SIGNING_KEY" | gpg --batch --import
          for f in src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage; do
            if [ -n "$GPG_PASSPHRASE" ]; then
              gpg --batch --yes --pinentry-mode loopback \
                  --passphrase "$GPG_PASSPHRASE" \
                  --detach-sign --armor "$f"
            else
              # No passphrase set on the signing key — feed an empty
              # passphrase via fd 0 with --pinentry-mode loopback. gpg
              # rejects bare `--passphrase ""` ("No passphrase given")
              # and rejects no --passphrase + no TTY ("Inappropriate
              # ioctl"); piping empty stdin to --passphrase-fd 0 is
              # the form gpg accepts for no-passphrase keys.
              echo "" | gpg --batch --yes --pinentry-mode loopback \
                  --passphrase-fd 0 \
                  --detach-sign --armor "$f"
            fi
          done

      - name: Upload AppImage signature to release
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # tauri-action uploads the AppImage itself but not our detached
          # GPG signature. Push the .asc into the same draft release so
          # users can verify integrity without an extra step.
          for f in src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage.asc; do
            [ -e "$f" ] || continue
            gh release upload "${{ github.ref_name }}" "$f" --clobber
          done

      # SLSA build-provenance attestations (audit B-3). Sigstore-signed
      # statements registered with GitHub's attestation API. The
      # subject-path glob covers every artifact this matrix leg
      # produces — AppImage/deb/rpm on Linux, dmg/.app.tar.gz on
      # macOS, msi/exe on Windows. Users verify with:
      #   gh attestation verify <downloaded-file> \
      #       -R wyattts/Mr.-Moneypenny
      # This complements the existing minisign-signed Tauri updater
      # bundles (which protect in-app auto-updates) and the GPG-signed
      # AppImage (which protects users grabbing the AppImage manually
      # from Releases). Provenance attestations defend against a
      # different threat: a compromised release page where artifacts
      # are swapped post-build.
      - name: Generate SLSA build-provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi

  promote:
    name: Promote draft to latest
    # Run only when every matrix leg of `release` succeeded. This is
    # the gate that replaces the manual `gh release edit --draft=false
    # --latest` step Wyatt used to run after each tag — forgetting it
    # silently breaks the auto-updater (the updater fetches
    # latest/download/latest.json which is gated on the `latest` flag).
    # See v0.3.4 retraction in the CHANGELOG for prior art.
    #
    # Race-safety (added after v0.3.16/v0.3.17 collision): when multiple
    # tags are pushed in a single `git push`, GitHub Actions fires one
    # workflow run per tag and the matrix builds finish in arbitrary
    # order. The earlier behavior — unconditional `gh release edit ...
    # --latest` — meant whichever promote job ran *last* won the latest
    # flag, even if it was the older version. We now compare against
    # the highest version tag across all releases (including draft
    # siblings still being built) and only flag --latest when we're it.
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Promote (only if this is the highest version tag)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          THIS_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Highest non-prerelease tag across the repo, including drafts
          # — a draft here is a sibling release run that hasn't promoted
          # yet, and we want to defer to it if its version is higher.
          # `sort -V` is semver-aware (v0.3.10 > v0.3.9).
          highest=$(gh release list --limit 100 \
            --repo "${{ github.repository }}" \
            --json tagName,isPrerelease \
            --jq '[.[] | select(.isPrerelease|not) | .tagName] | .[]' \
            | sort -V | tail -1)

          echo "this_tag=$THIS_TAG"
          echo "highest_tag=$highest"

          if [ "$highest" = "$THIS_TAG" ]; then
            gh release edit "$THIS_TAG" \
              --repo "${{ github.repository }}" \
              --draft=false \
              --latest
            echo "Promoted $THIS_TAG to latest."
          else
            gh release edit "$THIS_TAG" \
              --repo "${{ github.repository }}" \
              --draft=false
            echo "Published $THIS_TAG as non-draft; kept $highest as latest."
          fi
